<!DOCTYPE html>
<html>
<head>
    <title>Today...</title>
    <meta property="og:image" content="">
    <meta property="og:title" content="Today...">
    <meta property="og:description" content="여기를 눌러 링크를 확인하세요.">
    
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            font-family: sans-serif;
        }
        .push-btn {
            background-color: #ffc0cb;
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #gold-image-container {
            display: none; 
            margin-top: 20px;
            text-align: center;
        }
        .pop-up {
            width: 300px;
            animation: grow 0.5s ease-out forwards;
        }
        @keyframes grow {
            from { transform: scale(0.1); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <p>눌러봐</p>
    <button class="push-btn" onclick="showImage()">PUSH</button>

    <div id="gold-image-container">
        <p style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;">누나 오늘도 힘내</p>
        <img src="leeyulee.jpg" alt="응원 이미지" class="pop-up">
    </div>

    <script>
        function showImage() {
            document.getElementById('gold-image-container').style.display = 'block';
        }
    </script>

</body>
</html>
