<!DOCTYPE html>
<html>
<head>
    <title>Today...</title>
<meta property="og:image" content="">
    <meta property="og:title" content="Today...">
    <meta property="og:description" content="눌러봐야 알 수 있는 행운!">
    
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            font-family: sans-serif;
        }

        .push-btn {
            background-color: #ffc0cb;
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .push-btn:active {
            transform: scale(0.9); /* 버튼 누를 때 살짝 들어가는 효과 */
        }

        /* 이미지가 들어갈 박스 설정 */
        #gold-image-container {
            display: none; /* 처음엔 숨김 */
            margin-top: 20px;
            text-align: center;
        }

        /* 곰돌이 사진 애니메이션 */
        .pop-up {
            width: 300px;
            animation: grow 0.5s ease-out forwards;
        }

        @keyframes grow {
            from {
                transform: scale(0.1); /* 아주 작게 시작 */
                opacity: 0;
            }
            to {
                transform: scale(1); /* 원래 크기로 */
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <p>눌러봐</p>
    <button class="push-btn" onclick="showImage()">PUSH</button>

    <div id="gold-image-container">
        <p style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;">누나 오늘도 힘내</p>
        
        <img src="leeyulee.JPG" alt="이유리 너의 것" class="pop-up">
    </div>

</body>
</html>
