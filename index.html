<!DOCTYPE html>
<html>
<head>
    <title>Today...</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            font-family: sans-serif;
        }
        .push-btn {
            background-color: #ffc0cb;
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .push-btn:active { transform: scale(0.9); }
        #gold-image-container {
            display: none; 
            margin-top: 20px;
            text-align: center;
        }
        .pop-up {
            width: 300px;
            animation: grow 0.5s ease-out forwards;
        }
        @keyframes grow {
            from { transform: scale(0.1); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <p>눌러봐</p>
    <button class="push-btn" onclick="showImage()">PUSH</button>

    <div id="gold-image-container">
        <p style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;">누나 오늘도 힘내</p>
        <img src="leeyulee.jpg" alt="응원 이미지" class="pop-up">
    </div>

    <script>
        function showImage() {
            // 버튼 클릭 시 컨테이너를 보이게 함
            document.getElementById('gold-image-container').style.display = 'block';
        }
    </script>

</body>
</html>
